<!DOCTYPE html><html lang='it'>
    <link rel="icon" href="favicon.ico">
    <head><meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width,initial-scale=1'>
    <title>LIVEZONE</title>
    <link rel="stylesheet" href="css/debug-panel.css">
    <link rel='preconnect' href='https://fonts.googleapis.com'>
    <link rel='preconnect' href='https://fonts.gstatic.com' crossorigin>
    <link href='https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap' rel='stylesheet'>
    <link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/player.css">
<link rel="stylesheet" href="css/branding.css">
<link rel="stylesheet" href="css/status.css">
<link rel="stylesheet" href="css/ticker.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/overlay.css">
<link rel="stylesheet" href="css/notification.css">
</head><body>
    <div id='app'>
        <header class="header">

    <div class="brand">
<img
            src="assets/logo/logo-lz.svg"
            class="brand-logo"
            alt="LZ">
            
        <!--<div class="brand-logo" style="
width:40px;
height:40px;
background:#ff0000;
"></div>-->

        <span class="brand-live">live</span>
        <span class="brand-zone">zone</span>

    </div>

    <div class="header-info">

        <div class="broadcast-controls" role="group" aria-label="Broadcast control">
            <button class="broadcast-control" type="button" data-broadcast-state="LIVE" aria-pressed="false">LIVE</button>
            <button class="broadcast-control" type="button" data-broadcast-state="BREAK" aria-pressed="false">BREAK</button>
            <button class="broadcast-control" type="button" data-broadcast-state="OFFLINE" aria-pressed="true">OFFLINE</button>
            <button class="broadcast-control" type="button" data-broadcast-state="PROGRAM" aria-pressed="false">PROGRAM</button>
        </div>

        <div class="live-badge broadcast-offline">
            <span class="live-dot"></span>
            <span id="broadcast-state-label">OFFLINE</span>
        </div>

        <div id="clock">--:--:--</div>

    </div>

</header>
<main class='main'><div class='player-wrapper'><video id='video' autoplay muted controls playsinline></video>
    <div class="video-overlay">

    <div class="lz-brand">

        <img
            class="lz-watermark"
            src="assets/logo/logo-lz.svg"
            alt="LIVEZONE">

        <div class="lz-channel">

            LIVEZONE

        </div>

    </div>

</div>
    <div id="overlay" class="overlay">

    <div class="overlay__panel">

        <div class="overlay__logo">
            LZ
        </div>

        <div id="overlay-message" class="overlay__title">
            Segnale assente
        </div>

        <div class="overlay__subtitle">
            Riconnessione automatica
        </div>

        <div id="overlay-countdown" class="overlay__countdown">
            00:05
        </div>

        <div class="overlay__footer">
            LIVEZONE Broadcast Engine
        </div>

    </div>

</div>
</div></main>
<section class='status-bar'>
    <div id='status'>● CONNECTING...</div>
<div>HLS</div>
<div>FULL HD</div>
<button id="engine-monitor-toggle" type="button">MON</button>
</section>
<section class='ticker'>
    <div class='ticker-text'>► Benvenuti su LIVEZONE • Broadcast Engine •</div>
</section>
<div id="notification-center" class="notification-center"></div>
    <script src='lib/hls.min.js'></script><script type='module' src='js/app.js'>

</script>
<!-- Engine Debug Panel -->
<div id="debug-panel" class="debug-panel hidden"></div>
</body>
</html>
