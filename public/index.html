<!doctype html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LIVEZONE · Program</title>
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="css/public-viewer.css">
</head>
<body class="public-viewer">
    <main id="public-site" class="public-site">
        <header class="public-site__brand" aria-label="LIVEZONE">
            <img src="assets/logo/logo-lz.svg" alt="" class="public-site__logo">
            <span>LIVEZONE</span>
        </header>
        <section class="public-site__welcome" aria-labelledby="public-welcome-title">
            <p class="public-site__eyebrow">LIVE CHANNEL</p>
            <h1 id="public-welcome-title">Benvenuto su LIVEZONE</h1>
            <p>Segui qui il Program ufficiale LIVEZONE.</p>
        </section>
        <section id="public-program" class="public-program" aria-label="LIVEZONE Program output">
            <div class="public-program__tv">
                <div class="public-program__composition">
                    <div class="public-program__base" data-public-base></div>
                    <div class="public-program__graphics" data-public-graphics></div>
                </div>
            </div>
            <div id="public-program-status" class="public-program__status" data-state="offline">OFFLINE</div>
            <button id="public-audio-enable" class="public-program__audio" type="button" hidden>ENABLE AUDIO</button>
        </section>
        <button id="public-fullscreen-toggle" class="public-site__fullscreen" type="button"
            aria-label="Guarda LIVEZONE a tutto schermo" aria-pressed="false">
            GUARDA A TUTTO SCHERMO
        </button>
    </main>
    <script src="lib/hls.min.js"></script>
    <script type="module" src="js/entries/public-app.js"></script>
</body>
</html>
